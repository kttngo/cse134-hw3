  <main>
    <h1>Contact</h1>

    <section>
      <h2>Send a Message</h2>
      <form>
        <fieldset>
          <legend>Info</legend>
          <p>
            <label for="name">Name</label><br>
            <input type="text" id="name" name="name" autocomplete="name" required>
          </p>
          <p>
            <label for="email">Email</label><br>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </p>
          <p>
            <label for="company">Company</label><br>
            <input type="text" id="company" name="company" autocomplete="organization">
          </p>
        </fieldset>

        <fieldset>
          <legend>Reason</legend>
          <p>
            <input type="radio" id="reason-job" name="reason" value="job" checked>
            <label for="reason-job">Job or internship opportunity</label>
          </p>
          <p>
            <input type="radio" id="reason-collab" name="reason" value="collaboration">
            <label for="reason-collab">Project collaboration</label>
          </p>
          <p>
            <input type="radio" id="reason-other" name="reason" value="other">
            <label for="reason-other">Something else</label>
          </p>
        </fieldset>

        <fieldset>
          <legend>Your Message</legend>
          <p>
            <label for="message">Message</label><br>
            <textarea id="message" name="message" rows="6" cols="40" required></textarea>
          </p>
          <p>
            <input type="checkbox" id="copy" name="copy" value="yes">
            <label for="copy">Send a copy</label>
          </p>
        </fieldset>

        <p><button type="submit">Submit</button></p>
      </form>
    </section>
    <hello-world></hello-world>
  </main>
